name: Security audit

on:
  schedule:
    - cron: '0 8 * * 1'        # every Monday 08:00 UTC
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci || npm install

      - name: Run npm audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev 2>&1 | tee audit-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Create issue on vulnerabilities
        if: steps.audit.outputs.exit_code != '0' && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit-output.txt', 'utf8');
            const title = `🔒 npm audit: vulnerabilities found (${new Date().toISOString().slice(0,10)})`;

            // Don't create duplicate issues
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security',
            });
            if (issues.some(i => i.title.startsWith('🔒 npm audit'))) {
              core.info('Open security issue already exists — skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ['security'],
              body: `Weekly \`npm audit\` found vulnerabilities in production dependencies.\n\n\`\`\`\n${output.slice(0, 3000)}\n\`\`\`\n\nRun \`npm audit fix\` or update affected packages.`,
            });

      - name: Fail CI on high/critical
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "::warning::npm audit found vulnerabilities — see output above"
          npm audit --omit=dev --audit-level=high
