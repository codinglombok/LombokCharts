name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write                          # ← tambah ini
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}   # ← tambah ini
          token: ${{ secrets.GITHUB_TOKEN }}           # ← tambah ini
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      # ↓↓↓ TAMBAH STEP BARU INI ↓↓↓
      - name: Auto-commit dist on release-please branch
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'release-please-')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git diff --cached --quiet || (git commit -m "chore: rebuild dist" && git push)
      # ↑↑↑ END STEP BARU ↑↑↑

      - name: Verify committed dist is up to date
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale — run 'npm run build' and commit"
            git --no-pager diff --stat -- dist/
            git --no-pager diff -- dist/ | head -80
            exit 1
          fi

      - name: Report bundle size
        run: |
          echo "### Bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          echo '| file | raw | gzip |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for f in dist/lombok-charts.esm.min.js dist/lombok-charts.umd.min.js; do
            raw=$(du -k "$f" | cut -f1)
            gz=$(gzip -c "$f" | wc -c | awk '{printf "%.1f", $1/1024}')
            echo "| $f | ${raw} KB | ${gz} KB |" >> "$GITHUB_STEP_SUMMARY"
          done