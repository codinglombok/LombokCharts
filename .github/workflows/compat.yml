name: Browser compat

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions: {}

jobs:
  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run build

      - name: Check ES target compatibility
        run: |
          echo "### Browser compatibility check" >> "$GITHUB_STEP_SUMMARY"
          npx es-check es2021 dist/lombok-charts.umd.js dist/lombok-charts.umd.min.js 2>&1 \
            && echo "✅ UMD — ES2021 OK" >> "$GITHUB_STEP_SUMMARY" \
            || { echo "❌ UMD — contains syntax above ES2021" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          npx es-check es2021 dist/lombok-charts.esm.js dist/lombok-charts.esm.min.js --module 2>&1 \
            && echo "✅ ESM — ES2021 OK" >> "$GITHUB_STEP_SUMMARY" \
            || { echo "❌ ESM — contains syntax above ES2021" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Verify UMD global export
        run: |
          node -e "
            const fs = require('fs');
            const vm = require('vm');
            const code = fs.readFileSync('dist/lombok-charts.umd.js', 'utf8');
            const ctx = { window: {}, self: {}, module: { exports: {} }, exports: {} };
            vm.createContext(ctx);
            vm.runInContext(code, ctx);
            const LC = ctx.window.LombokCharts || ctx.module.exports;
            const keys = Object.keys(LC);
            if (!keys.includes('chart')) {
              console.error('Missing chart() export in UMD build');
              process.exit(1);
            }
            console.log('UMD exports:', keys.join(', '));
          "
          echo "✅ UMD global export verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify ESM exports
        run: |
          node --input-type=module -e "
            import * as LC from './dist/lombok-charts.esm.js';
            const keys = Object.keys(LC);
            if (!keys.includes('chart')) {
              console.error('Missing chart() export in ESM build');
              process.exit(1);
            }
            console.log('ESM exports:', keys.join(', '));
          "
          echo "✅ ESM named exports verified" >> "$GITHUB_STEP_SUMMARY"
